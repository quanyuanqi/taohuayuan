  <style>
    * {
      margin: 0;

      box-sizing: border-box;
    }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

    /* 页面左上角标题 */

    /* 自定义多行标题样式 */

      text-align: center;
      margin: 60px auto 24px;
      max-width: 600px;
    }
    .title-main {
      font-size: 1.8rem;

    .title-sub {
      font-size: 1.3rem;

    .title-tag {

      max-width: 600px;

.anonymous-option {
  font-size: 0.9rem;

.advice-detail-block {

}

    .attachments {

    .attachment-item {
      display: flex;

      gap: 8px;

    }

    .attachment-icon {
      width: 16px;

      padding: 4px 8px;

    /* 移动端适配 */
    .comment-box {
      margin-top: 0;

    .comment-submit-btn {
      padding: 6px 12px;

      border-radius: 6px;

    }

      background: #0066b3;
    }

/* 修复建言详情的行间距（覆盖行内 style） */
.advice-detail-line {
  margin: 0 !important;

  line-height: 1.2 !important; /* 你可加大到1.3/1.4，根据效果微调 */
}


    
    .readonly-input {

    }

    @media (max-width: 480px) {

      }
      .advice-title {
        font-size: 1.0rem;

      }

      }

  /* 修复评论区空白过大的问题 */
  .comment-box {
    margin-top: 2px !important;

  }

  .comment-box > div {
    margin: 0 0 2px 0 !important;

  }

    margin-top: 0 !important;

  }

  .comment-box > div:last-child {

  .comment-author-input,
  .comment-content-input {

  </style>

<body>

  <!-- 左上角"桃花源"标题（带链接） -->
  <a href="https://www.taohuayuan.org.cn" target="_blank" class="page-title">桃花源</a>

  <!-- 页面主标题 -->
  <div class="title-container">
    <div class="title-main">建言献策</div>
    <div class="title-sub">让小区更美好！</div>
    <a class="title-tag" href="bulletin-board.html">点击阅读业委会公告</a>
  </div>

  <!-- 提交表单 -->
  <div class="form-container">
    <h3 style="margin-bottom: 20px;">提交信息</h3>
    <form id="adviceForm">
      <div class="anonymous-option">
        <label style="display:flex; align-items:center; gap:4px;">
          <input type="checkbox" id="anonymous-checkbox" />
          <span>点击勾选小方框，匿名提交信息</span>
        </label>
      </div>
      <div class="form-group">
        <label for="advice-name" class="field-label">姓名：</label>
        <input type="text" id="advice-name" name="name" placeholder="请输入您的姓名" maxlength="50" required />
      </div>
      <div class="form-group">
        <label for="advice-building" class="field-label">楼栋号：</label>
        <input type="text" id="advice-building" name="building" placeholder="请输入楼栋号" maxlength="100" required />
      </div>
      <div class="form-group">
        <label for="advice-contact" class="field-label">联系方式（电话）：</label>
        <input type="tel" id="advice-contact" name="contact" placeholder="请输入电话号码" maxlength="30" required />
      </div>
      <div class="form-group">
        <label for="advice-description">内容描述（可选）：</label>
        <textarea id="advice-description" name="description" rows="6" placeholder="请输入内容，支持超链接" maxlength="2000"></textarea>
        <div id="description-count" style="text-align: right; color: #666; font-size: 0.85rem; margin-top: 4px;">0/1000 汉字</div>
      </div>
      <div class="form-group attachments">
        <label for="advice-attachments">附件（图片/文档）：</label>
        <input type="file" id="advice-attachments" multiple accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.txt,.xls,.xlsx" />
        <div id="attachment-preview" class="attachment-list"></div>
      </div>
      <button type="submit" id="submit-btn">提交信息</button>
      <div id="submit-message"></div>
    </form>
  </div>

  <!-- 建言列表 -->
  <div class="advice-list" id="advice-list">
    <p style="text-align: center; color: #666;">正在加载建言...</p>
  </div>

  <script>
    // DOM 元素
    const form = document.getElementById('adviceForm');
    const submitBtn = document.getElementById('submit-btn');
    const submitMessage = document.getElementById('submit-message');
    const adviceName = document.getElementById('advice-name');
    const adviceBuilding = document.getElementById('advice-building');
    const adviceContact = document.getElementById('advice-contact');
    const adviceDescription = document.getElementById('advice-description');
    const adviceAttachments = document.getElementById('advice-attachments');
    const attachmentPreview = document.getElementById('attachment-preview');
    const adviceList = document.getElementById('advice-list');
    const descriptionCount = document.getElementById('description-count');
    const anonymousCheckbox = document.getElementById('anonymous-checkbox');
    const fieldLabels = document.querySelectorAll('.field-label');

    // 事件描述字数统计
    adviceDescription.addEventListener('input', () => {
      const text = adviceDescription.value;
      const chineseCharCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
      descriptionCount.textContent = `${chineseCharCount}/1000 汉字`;
      if (chineseCharCount > 1000) {
        descriptionCount.style.color = '#dc3545';
      } else {
        descriptionCount.style.color = '#666';
      }
    });
    adviceDescription.dispatchEvent(new Event('input'));

    // 匿名选项
    anonymousCheckbox.addEventListener('change', handleAnonymousToggle);
    handleAnonymousToggle();

    // 附件预览
    adviceAttachments.addEventListener('change', () => {
      const files = Array.from(adviceAttachments.files);
      attachmentPreview.innerHTML = files.map(file => `
        <div class="attachment-item">
          <span>${escapeHtml(file.name)}</span>
          <span>${(file.size / 1024).toFixed(1)} KB</span>
        </div>
      `).join('');
    });

    function handleAnonymousToggle() {
      const isAnon = anonymousCheckbox.checked;
      [adviceName, adviceBuilding, adviceContact].forEach(input => {
        input.disabled = isAnon;
        input.classList.toggle('readonly-input', isAnon);
        input.required = !isAnon;
        if (isAnon) {
          input.value = '';
        }
      });
      fieldLabels.forEach(label => {
        label.classList.toggle('readonly-label', isAnon);
      });
    }

    // 提交表单
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitMessage.innerHTML = '<div style="text-align: center; color: #666;">正在提交...</div>';
      
      const isAnonymous = anonymousCheckbox.checked;
      const name = adviceName.value.trim();
      const building = adviceBuilding.value.trim();
      const contact = adviceContact.value.trim();
      const description = adviceDescription.value.trim();
      const files = Array.from(adviceAttachments.files);

      if (!isAnonymous) {
        if (!name) {
          submitMessage.innerHTML = '<div class="error">姓名不能为空</div>';
          return;
        }

        if (!building) {
          submitMessage.innerHTML = '<div class="error">楼栋号不能为空</div>';
          return;
        }

        if (!contact) {
          submitMessage.innerHTML = '<div class="error">联系方式不能为空</div>';
          return;
        }

        const contactDigits = contact.replace(/\D/g, '');
        if (contactDigits.length !== 11) {
          submitMessage.innerHTML = '<div class="error">电话号码必须是11位数字</div>';
          return;
        }
      }

      // 验证事件描述字数（1000个汉字以内）
      const chineseCharCount = (description.match(/[\u4e00-\u9fa5]/g) || []).length;
      if (chineseCharCount > 1000) {
        submitMessage.innerHTML = '<div class="error">事件描述不能超过1000个汉字</div>';
        return;
      }

      if (files.length > 0) {
        // 检查文件类型
        const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', 'text/plain', 'application/vnd.ms-excel', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'];
        
        for (const file of files) {
          if (!allowedTypes.includes(file.type) && file.type !== '') {
            submitMessage.innerHTML = `<div class="error">文件类型不支持：${escapeHtml(file.name)}</div>`;
            return;
          }
        }
      }

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = '提交中...';

        // 准备提交数据
        const finalName = isAnonymous ? '匿名' : name;
        const finalBuilding = isAnonymous ? '匿名楼栋' : building;
        const finalContact = isAnonymous ? '00000000000' : contact.replace(/\D/g, '');

        const adviceData = {
          name: finalName,
          building: finalBuilding,
          contact: finalContact,
          description,
          attachments: []
        };

        // 如果有附件，上传到七牛云
        if (files.length > 0) {
          const uploadPromises = files.map(async (file) => {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('key', `advice-attachments/${Date.now()}-${Math.random().toString(36).substr(2, 9)}-${file.name}`);

            // 使用公开上传端点
            const uploadResponse = await fetch('/api/upload-advice', {
              method: 'POST',
              body: formData
            });

            if (!uploadResponse.ok) {
              const error = await uploadResponse.json();
              throw new Error(error.error || '附件上传失败');
            }

            const uploadData = await uploadResponse.json();
            
            // 直接上传到七牛云
            const directUploadFormData = new FormData();
            directUploadFormData.append('token', uploadData.uploadToken);
            directUploadFormData.append('key', uploadData.key);
            let uploadMime = file.type || '';
            if (!uploadMime && /\.txt$/i.test(file.name)) {
              uploadMime = 'text/plain; charset=utf-8';
            }
            if (uploadMime) {
              directUploadFormData.append('mimeType', uploadMime.includes('text/plain') && !uploadMime.includes('charset') ? 'text/plain; charset=utf-8' : uploadMime);
            }
            directUploadFormData.append('file', file);

            const directUploadResponse = await fetch('https://up-z2.qiniup.com/', {
              method: 'POST',
              body: directUploadFormData
            });

            if (!directUploadResponse.ok) {
              const errorText = await directUploadResponse.text();
              console.error('Direct upload failed:', errorText);
              throw new Error(`附件上传失败: ${errorText}`);
            }

            return {
              name: file.name,
              url: uploadData.url,
              size: file.size
            };
          });

          adviceData.attachments = await Promise.all(uploadPromises);
        }

        // 提交建言
        const response = await fetch('/api/advice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(adviceData)
        });

        if (response.ok) {
          submitMessage.innerHTML = '<div class="success">提交成功，请稍后查看回复及评论。</div>';
          form.reset();
          attachmentPreview.innerHTML = '';
          adviceName.value = '';
          adviceBuilding.value = '';
          adviceContact.value = '';
          adviceDescription.value = '';
          descriptionCount.textContent = '0/1000 汉字';
          descriptionCount.style.color = '#666';
          anonymousCheckbox.checked = false;
          handleAnonymousToggle();
          loadAdvices();
        } else {
          const error = await response.json();
          throw new Error(error.error || '提交失败');
        }
      } catch (err) {
        console.error('Submit error:', err);
        submitMessage.innerHTML = `<div class="error">提交失败：${err.message}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交';
      }
    });

    // 加载建言列表
    async function loadAdvices() {
      try {
        const response = await fetch('/api/advice');
        if (!response.ok) throw new Error('加载失败');
        
        const advices = await response.json();
        renderAdvices(advices);
      } catch (err) {
        console.error('Load error:', err);
        adviceList.innerHTML = '<p style="text-align: center; color: #666;">加载建言失败</p>';
      }
    }

    // 渲染建言列表
    function renderAdvices(advices) {
      if (!advices || advices.length === 0) {
        adviceList.innerHTML = '<p style="text-align: center; color: #666;">暂无建言</p>';
        return;
      }

      // 按时间倒序排列
      advices.sort((a, b) => new Date(b.date) - new Date(a.date));

      const html = advices.map(advice => {
        const name = advice.name ?? advice.author ?? '匿名';
        const building = advice.building ?? '';
        const contact = advice.contact ?? advice.title ?? '';
        const description = advice.description ?? advice.content ?? '';
        const contentApproved = advice.contentApproved === undefined ? true : Boolean(advice.contentApproved);

        const displayTitle = `${maskName(name)} 的信息`;

        const previewTextRaw = contentApproved
          ? (description ? description : '（用户未填写事件描述）')
          : '（内容待审核，审核通过后展示）';
        const preview = previewTextRaw.length > 60 ? previewTextRaw.slice(0, 60) + '...' : previewTextRaw;
        
        // 转义 HTML 并处理超链接
        const contentWithLinks = description
          ? escapeHtml(description).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>')
          : '（用户未填写事件描述）';
        
        const previewWithLinks = escapeHtml(preview).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');

        const pendingAttachments = Array.isArray(advice.pendingAttachments) ? advice.pendingAttachments : [];
        const pendingNote = pendingAttachments.length > 0
          ? `<div class="attachments" style="border-color:#ffe58a;background:#fffbe6;"><div style="font-weight:bold;margin-bottom:4px;">附件审核中：</div>${pendingAttachments.map(att => `<div style="margin:4px 0;color:#888;">${escapeHtml(att.name)}</div>`).join('')}</div>`
          : '';

        const repliesHtml = Array.isArray(advice.replies) && advice.replies.length > 0
          ? `<div class="attachments" style="border-top:none;margin-top:8px;padding-top:0;">${advice.replies.map(r => {
              const d = r.date ? new Date(r.date) : null;
              const dateStr = d && !isNaN(d) ? `${d.getFullYear()}年${(d.getMonth()+1).toString().padStart(2,'0')}月${d.getDate().toString().padStart(2,'0')}日` : '';
              return `<div style="margin:6px 0;">
                <span style="color:#d00;font-weight:bold;margin-right:6px;">业委会回复</span>
                ${dateStr ? `<span style="color:#888;font-size:0.85rem;margin-right:6px;">${dateStr}</span>` : ''}
                <span>${escapeHtml(r.content)}</span>
              </div>`;
            }).join('')}</div>`
          : '';

        const commentsHtml = Array.isArray(advice.comments) && advice.comments.length > 0
          ? `<div class="attachments"><div style="font-weight:bold;margin-bottom:6px;">评论：</div>${advice.comments.map(c => {
              const d = c.date ? new Date(c.date) : null;
              const dateStr = d && !isNaN(d) ? `${d.getFullYear()}年${(d.getMonth()+1).toString().padStart(2,'0')}月${d.getDate().toString().padStart(2,'0')}日 ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}` : '';
              return `<div style="margin:4px 0;"><span style="color:#555;margin-right:6px;">${escapeHtml(c.author || '匿名')}</span>${dateStr ? `<span style="color:#888;font-size:0.85rem;margin-right:6px;">${dateStr}</span>` : ''}<span>${escapeHtml(c.content)}</span></div>`;
            }).join('')}</div>`
          : '';

        const commentForm = `<div class="comment-box" onclick="event.stopPropagation();">
          <div style="font-weight:bold;">我要评论：</div>
          <div>
            <input type="text" id="c-author-${advice.id}" class="comment-author-input" placeholder="网名（可选）" style="width:100%; max-width: 360px;" />
          </div>
          <div>
            <textarea id="c-content-${advice.id}" class="comment-content-input" placeholder="评论内容" style="width:100%;"></textarea>
          </div>
          <div>
            <input type="tel" id="c-phone-${advice.id}" class="comment-author-input" placeholder="手机号" style="width:100%; max-width: 360px;" maxlength="11" />
          </div>
          <div>
            <button type="button" class="comment-submit-btn" onclick="event.stopPropagation(); sendVerifyCode('${advice.id}')" id="c-send-btn-${advice.id}" style="padding:6px 12px; white-space:nowrap; width:100%; max-width: 200px;">发送验证码</button>
          </div>
          <div>
            <input type="text" id="c-verify-${advice.id}" class="comment-author-input" placeholder="短信验证码" style="width:100%; max-width: 360px;" maxlength="6" />
          </div>
          <div style="font-size:0.75rem; color:#999;">
            网站不收集、不存储用户手机号码信息，短信验证服务由阿里云'速通互联验证平台'提供。
          </div>
          <div>
            <button class="comment-submit-btn" onclick="event.stopPropagation(); submitComment('${advice.id}')">提交</button>
          </div>
          <div id="c-msg-${advice.id}" style="font-size:0.85rem;color:#666;"></div>
        </div>`;

        return `<div class="advice-item">
          <div class="advice-title" onclick="toggleAdvice('${advice.id}')">${escapeHtml(displayTitle)}</div>
          <div class="advice-meta">姓名：${escapeHtml(maskName(name))} | 楼栋号：**** | 联系方式：${escapeHtml(maskContact(contact))} | 时间：${new Date(advice.date).toLocaleString('zh-CN')}</div>
          <div class="advice-content preview" id="content-${advice.id}">${previewWithLinks}</div>
          <div class="advice-content full" id="full-content-${advice.id}" style="display: none;">
            <div class="advice-detail-block">
              <div class="advice-detail-line">姓名：${escapeHtml(maskName(name))}</div>
              <div class="advice-detail-line">楼栋号：****</div>
              <div class="advice-detail-line">联系方式：${escapeHtml(maskContact(contact))}</div>
              <div class="advice-detail-line">提交时间：${new Date(advice.date).toLocaleString('zh-CN')}</div>
            </div>
            ${contentApproved
              ? contentWithLinks
              : '<div style="margin-top:8px;padding:10px;border:1px dashed #f0ad4e;background:#fff8e5;color:#a56800;border-radius:6px;">内容待审核，管理员通过后即可查看详细描述。</div>'}
            ${pendingNote}
            ${repliesHtml}
            ${renderAttachments(advice.attachments)}
            ${commentsHtml}
            ${commentForm}
          </div>
        </div>`;
      }).join('');

      adviceList.innerHTML = html;
    }

    // 渲染附件
    function renderAttachments(attachments) {
      if (!attachments || attachments.length === 0) return '';
      
      return `<div class="attachments"><div style="font-weight: bold; margin-bottom: 8px;">附件：</div>${attachments.map(attachment => {
        const escapedUrl = attachment.url.replace(/\"/g, '&quot;').replace(/'/g, '&#39;');
        const isWord = /\.(docx?)$/i.test(attachment.name || '');
        const officeViewer = `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(attachment.url)}`;
        const viewUrl = isWord ? officeViewer : escapedUrl;
        return `<div class="attachment-item"><a href="${viewUrl}" target="_blank" style="display: flex; align-items: center; gap: 8px; color: #0077cc; text-decoration: none; flex: 1;"><span class="attachment-icon">📁</span><span>${escapeHtml(attachment.name)}</span></a><a href="${escapedUrl}" download="${escapeHtml(attachment.name)}" class="attachment-download-btn">下载</a><span style="color: #999; margin-left: 8px;">(${formatFileSize(attachment.size)})</span></div>`;
      }).join('')}</div>`;
    }

    // 格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 切换建言内容显示
    window.toggleAdvice = function(id) {
      const previewEl = document.getElementById(`content-${id}`);
      const fullEl = document.getElementById(`full-content-${id}`);
      
      if (fullEl.style.display === 'block') {
        // 收起
        fullEl.style.display = 'none';
        previewEl.style.display = 'block';
      } else {
        // 展开
        previewEl.style.display = 'none';
        fullEl.style.display = 'block';
      }
    };

    // 转义 HTML
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 发送短信验证码
    window.sendVerifyCode = async function(id) {
      const phoneInput = document.getElementById(`c-phone-${id}`);
      const sendBtn = document.getElementById(`c-send-btn-${id}`);
      const msgEl = document.getElementById(`c-msg-${id}`);
      const phoneNumber = (phoneInput?.value || '').trim();

      const phoneRegex = /^1[3-9]\d{9}$/;
      if (!phoneNumber) {
        msgEl.textContent = '请输入手机号';
        msgEl.style.color = '#dc3545';
        return;
      }
      if (!phoneRegex.test(phoneNumber)) {
        msgEl.textContent = '手机号格式不正确';
        msgEl.style.color = '#dc3545';
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = '发送中...';
      msgEl.textContent = '正在发送验证码...';
      msgEl.style.color = '#666';

      try {
        const res = await fetch('/api/sms-verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: 'send',
            phoneNumber
          })
        });

        const result = await res.json();
        if (!res.ok) {
          throw new Error(result.error || '发送失败');
        }

        msgEl.textContent = '验证码已发送，请查收短信';
        msgEl.style.color = '#28a745';

        let countdown = 60;
        const timer = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            sendBtn.textContent = `${countdown}秒后重发`;
          } else {
            sendBtn.disabled = false;
            sendBtn.textContent = '发送验证码';
            clearInterval(timer);
          }
        }, 1000);
      } catch (e) {
        msgEl.textContent = `发送失败：${e.message}`;
        msgEl.style.color = '#dc3545';
        sendBtn.disabled = false;
        sendBtn.textContent = '发送验证码';
      }
    }

    // 提交评论
    window.submitComment = async function(id) {
      const authorInput = document.getElementById(`c-author-${id}`);
      const contentInput = document.getElementById(`c-content-${id}`);
      const phoneInput = document.getElementById(`c-phone-${id}`);
      const verifyInput = document.getElementById(`c-verify-${id}`);
      const msgEl = document.getElementById(`c-msg-${id}`);
      const author = (authorInput?.value || '').trim();
      const content = (contentInput?.value || '').trim();
      const phoneNumber = (phoneInput?.value || '').trim();
      const verifyCode = (verifyInput?.value || '').trim();

      if (!content) {
        msgEl.textContent = '评论内容不能为空';
        msgEl.style.color = '#dc3545';
        return;
      }
      if (!phoneNumber) {
        msgEl.textContent = '请输入手机号';
        msgEl.style.color = '#dc3545';
        return;
      }
      if (!verifyCode) {
        msgEl.textContent = '请输入短信验证码';
        msgEl.style.color = '#dc3545';
        return;
      }

      msgEl.textContent = '正在提交...';
      msgEl.style.color = '#666';
      try {
        const res = await fetch('/api/advice-comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adviceId: id,
            author,
            content,
            phoneNumber,
            verifyCode
          })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || '提交失败');
        }
        msgEl.textContent = '提交成功';
        msgEl.style.color = '#28a745';
        if (authorInput) authorInput.value = '';
        if (contentInput) contentInput.value = '';
        if (phoneInput) phoneInput.value = '';
        if (verifyInput) verifyInput.value = '';
        loadAdvices();
      } catch (e) {
        msgEl.textContent = `提交失败：${e.message}`;
        msgEl.style.color = '#dc3545';
      }
    }

    function maskName(name) {
      if (!name) return '匿名';
      const trimmed = name.trim();
      return trimmed.charAt(0) + '****';
    }

    function maskContact(contact) {
      if (!contact) return '****';
      const digits = contact.replace(/\D/g, '');
      if (digits.length < 7) return contact;
      const start = digits.slice(0, 3);
      const end = digits.slice(-4);
      return `${start}****${end}`;
    }

    // 初始化
    loadAdvices();
  </script>
</body>
</html>
